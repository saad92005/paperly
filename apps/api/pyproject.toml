[project]
name = "paperly-api"
version = "0.1.0"
description = "Paperly API: FastAPI service with an in-process job worker"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pysbd>=0.3.4",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reportlab>=5.0.1",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101", "S608", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pyright]
include = ["app"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# SQL rows are dict[str, Any]; "unknown" noise is off, everything else stays strict.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
